<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASPI Hub Community</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="community.css">
</head>


<body>


<nav>

    <div class="logo">
        🎓 ASPI Hub
    </div>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="dashboard.html">Dashboard</a></li>

        <li><a href="resources.html">Resources</a></li>

        <li><a href="tools.html">Tools</a></li>

        <li><a href="timetable.html">Timetable</a></li>

        <li><a href="calendar.html">Calendar</a></li>

        <li><a href="community.html">Community</a></li>

    </ul>


    <button onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

</nav>



<header class="community-hero">

    <h1>
        💬 ASPI Community
    </h1>

    <p>
        Ask questions, share study tips,
        and help other ASPI students.
    </p>

</header>



<main class="community-page">


    <!-- CREATE POST -->

    <section class="create-post-card">

        <h2>
            ✍️ Create a Post
        </h2>


        <input
            type="text"
            id="postTitle"
            placeholder="Post title"
        >


        <textarea
            id="postContent"
            placeholder="What would you like to share?"
        ></textarea>


        <div class="post-options">


            <select id="postCategory">

                <option value="question">
                    ❓ Question
                </option>

                <option value="study">
                    📚 Study Tip
                </option>

                <option value="announcement">
                    📢 Announcement
                </option>

                <option value="resource">
                    🔗 Resource
                </option>

            </select>


            <select id="postSubject">

                <option value="General">
                    General
                </option>

                <option value="Biology">
                    Biology
                </option>

                <option value="Physics">
                    Physics
                </option>

                <option value="Chemistry">
                    Chemistry
                </option>

                <option value="LLA">
                    LLA
                </option>

                <option value="Logical Reasoning">
                    Logical Reasoning
                </option>

                <option value="Statistics">
                    Statistics
                </option>

                <option value="Research">
                    Research
                </option>

                <option value="Jati Diri">
                    Jati Diri
                </option>

            </select>


            <button id="publishPost">
                Publish
            </button>

        </div>

    </section>



    <!-- FILTERS -->

    <section class="community-filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>


        <button
            class="filter-btn"
            data-filter="question"
        >
            ❓ Questions
        </button>


        <button
            class="filter-btn"
            data-filter="study"
        >
            📚 Study Tips
        </button>


        <button
            class="filter-btn"
            data-filter="announcement"
        >
            📢 Announcements
        </button>


        <button
            class="filter-btn"
            data-filter="resource"
        >
            🔗 Resources
        </button>

    </section>



    <!-- COMMUNITY POSTS -->

    <section
        id="communityPosts"
        class="community-posts"
    >

        <!-- community.js adds posts here -->

    </section>


</main>



<footer>

    <p>
        © 2026 ASPI Hub | Built for ASPI Students
    </p>

</footer>



<script src="script.js"></script>

<script src="community.js"></script>


</body>

</html>
