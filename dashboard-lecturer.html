<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { 
            max-width: 900px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }
        .user-card { 
            background: var(--card-bg, #ffffff); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
            border: 1px solid var(--border-color, #e0e0e0);
        }
        .upload-section {
            background: var(--card-bg, #ffffff);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color, #e0e0e0);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        .form-group input, .form-group select {
            width: 100%; 
            padding: 10px; 
            border: 1px solid var(--border-color, #ccc);
            border-radius: 6px; 
            box-sizing: border-box;
            background: var(--bg-color, #fff); 
            color: var(--text-color, #333);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">👨‍🏫 PINTAR@Sphere (Lecturer)</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="dashboard-lecturer.html" style="color: white; text-decoration: none; font-weight: bold;">Dashboard</a>
            <a href="community.html" style="color: white; text-decoration: none;">Community</a>
            <a href="profile.html" style="color: white; text-decoration: none;">Profile</a>
            <button id="btnLogout" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Lecturer Profile Card -->
        <div class="user-card">
            <h2>Welcome, Dr./Lecturer <span id="lecturerName">...</span> 👨‍🏫</h2>
            <p><strong>Email Address:</strong> <span id="lecturerEmail">-</span></p>
        </div>

        <!-- Learning Resources Upload Section -->
        <div class="upload-section">
            <h3 style="margin-top: 0;">📤 Upload Subject Learning Resources</h3>
            <p style="color: #666; font-size: 14px;">Share Google Drive links, lecture notes, or exercises for students based on subjects.</p>

            <form id="uploadResourceForm">
                <div class="form-group">
                    <label>Select Subject</label>
                    <select id="resSubject" required>
                        <option value="biology">Biology</option>
                        <option value="chemistry">Chemistry</option>
                        <option value="physics">Physics</option>
                        <option value="mathematics">Mathematics</option>
                        <option value="english">English</option>
                        <option value="computing">Computer Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Resource Title</label>
                    <input type="text" id="resTitle" placeholder="e.g. Biology Chapter 1 Notes - Cell Structure" required>
                </div>

                <div class="form-group">
                    <label>Resource Link (Google Drive / URL)</label>
                    <input type="url" id="resUrl" placeholder="https://drive.google.com/..." required>
                </div>

                <button type="submit" id="btnUploadSubmit" style="padding: 12px 20px; background: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                    Share Resource
                </button>
            </form>
        </div>
    </div>

    <!-- Script Module -->
    <script type="module">
        import { logoutUser } from './auth.js';
        import { auth, db, doc, getDoc, collection, addDoc, serverTimestamp } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Check authentication & role
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.role !== 'lecturer') {
                        // Redirect students to student dashboard
                        window.location.href = 'dashboard-student.html';
                        return;
                    }
                    document.getElementById('lecturerName').textContent = data.name || 'Lecturer';
                    document.getElementById('lecturerEmail').textContent = data.email || '-';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // Logout Event
        document.getElementById('btnLogout').addEventListener('click', () => {
            logoutUser();
        });

        // Upload Resource to Firestore
        document.getElementById('uploadResourceForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Menghalang muat semula halaman atau redirect tidak sengaja
            
            const subject = document.getElementById('resSubject').value;
            const title = document.getElementById('resTitle').value.trim();
            const url = document.getElementById('resUrl').value.trim();
            const btn = document.getElementById('btnUploadSubmit');

            if (!title || !url) {
                alert('Please fill in all fields!');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Uploading...';

                await addDoc(collection(db, "resources"), {
                    subject: subject,
                    title: title,
                    url: url,
                    uploadedBy: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });

                alert('Resource shared successfully!');
                document.getElementById('uploadResourceForm').reset();
            } catch (err) {
                console.error("Upload Error:", err);
                alert('Upload failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Share Resource';
            }
        });
    </script>
    <script type="module" src="app-core.js"></script>
</body>
</html>
