<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login_title">Log Masuk - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .lang-picker {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-picker select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🎓 PINTAR@Sphere</div>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </nav>

    <div class="login-container">
        <!-- Tetapan Pilihan Bahasa (Paling Atas Pad Portal Log Masuk) -->
        <div class="lang-picker">
            <span style="font-size: 14px;">🌐</span>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ms">Bahasa Melayu</option>
                <option value="en">English</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="ta">தமிழ் (Tamil)</option>
            </select>
        </div>

        <h2 style="text-align: center; margin-top:0;" data-i18n="welcome_header">Selamat Datang</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;" data-i18n="welcome_sub">Sila log masuk ke akaun anda</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="label_email">E-mel</label>
                <input type="email" id="email" placeholder="contoh@siswa.um.edu.my" required>
            </div>
            
            <div class="form-group">
                <label data-i18n="label_password">Kata Laluan</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; margin-top: 10px;" data-i18n="btn_login">Log Masuk</button>
        </form>

        <p style="text-align: center; font-size: 13px; margin-top: 20px;">
            <span data-i18n="no_account">Belum mempunyai akaun?</span> 
            <a href="#" style="color: var(--primary-color); text-decoration: none; font-weight: bold;" data-i18n="register_here">Daftar di sini</a>
        </p>
    </div>

    <!-- Panggilan Modul Bahasa & Firebase -->
    <script type="module">
        import { applyTranslations, currentLang } from './i18n.js';
        import { loginUser } from './auth.js';

        // Set pilihan dropdown mengikut bahasa terkini yang disimpan di LocalStorage
        document.getElementById('langSelect').value = currentLang;

        // Fungsi penukaran bahasa untuk menu dropdown
        window.changeLanguage = function(lang) {
            localStorage.setItem('pintar_lang', lang);
            location.reload(); // Muat semula halaman untuk mengaplikasikan terjemahan baharu
        };

        // Kuncikan tindakan submit form log masuk
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await loginUser(email, password);
        });
    </script>
    <script type="module" src="app-core.js"></script>
</body>
</html>
