<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login_title">Log Masuk - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: var(--card-bg, #ffffff);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color, #e0e0e0);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color, #ccc);
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--bg-color, #fff);
            color: var(--text-color, #333);
        }
        .lang-picker {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-picker select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color, #ccc);
            background: var(--card-bg, #fff);
            color: var(--text-color, #333);
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🎓 PINTAR@Sphere</div>
        <button id="btnDarkMode">🌙 Dark Mode</button>
    </nav>

    <div class="login-container">
        <!-- Menu Pilihan Bahasa (Paling Atas) -->
        <div class="lang-picker">
            <span style="font-size: 14px;">🌐</span>
            <select id="langSelect">
                <option value="ms">Bahasa Melayu</option>
                <option value="en">English</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="ta">தமிழ் (Tamil)</option>
            </select>
        </div>

        <h2 style="text-align: center; margin-top: 0;" data-i18n="welcome_header">Selamat Datang</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;" data-i18n="welcome_sub">Sila log masuk ke akaun anda</p>
        
        <!-- Form Log Masuk -->
        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="label_email">E-mel</label>
                <input type="email" id="email" placeholder="contoh@siswa.um.edu.my" required>
            </div>
            
            <div class="form-group">
                <label data-i18n="label_password">Kata Laluan</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnLoginSubmit" style="width: 100%; padding: 12px; margin-top: 10px; cursor: pointer;" data-i18n="btn_login">Log Masuk</button>
        </form>

        <!-- Pautan Ke Halaman Pendaftaran -->
        <p style="text-align: center; font-size: 13px; margin-top: 20px;">
            <span data-i18n="no_account">Belum mempunyai akaun?</span> 
            <a href="register.html" style="color: var(--primary-color, #0056b3); text-decoration: none; font-weight: bold;" data-i18n="register_here">Daftar di sini</a>
        </p>
    </div>

    <!-- Skrip Modul Autentikasi & Bahasa -->
    <script type="module">
        import { currentLang, setLanguage, applyTranslations } from './il8n.js';
        import { loginUser } from './auth.js';

        // 1. Tetapkan pilihan asal pada dropdown mengikut bahasa terkini
        const langSelect = document.getElementById('langSelect');
        if (langSelect) {
            langSelect.value = currentLang;

            // Tukar bahasa serta-merta apabila pengguna memilih pilihan baharu
            langSelect.addEventListener('change', (e) => {
                const selectedLang = e.target.value;
                setLanguage(selectedLang);
                applyTranslations();
            });
        }

        // 2. Terjemahkan teks pada halaman sebaik sahaja load
        applyTranslations();

        // 3. Kendalikan penghantaran form log masuk
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('btnLoginSubmit');
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    alert('Sila isi e-mel dan kata laluan!');
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.textContent = 'Memuatkan...';
                    await loginUser(email, password);
                } catch (err) {
                    console.error("Ralat Log Masuk:", err);
                } finally {
                    btn.disabled = false;
                    applyTranslations(); // Kembalikan teks button mengikut bahasa
                }
            });
        }
    </script>
    <script type="module" src="app-core.js"></script>
</body>
</html>
