<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk / Daftar - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .tab-btn.active {
            color: #0056b3;
            border-bottom: 3px solid #0056b3;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #003d80;
        }

        .error-msg {
            color: #d9534f;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🎓 PINTAR@Sphere</div>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </nav>

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Log Masuk</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Daftar Akaun</button>
        </div>

        <div id="errorAlert" class="error-msg"></div>

        <!-- FORM LOG MASUK -->
        <form id="loginForm">
            <div class="form-group">
                <label>E-mel Rasmi UKM</label>
                <input type="email" id="loginEmail" placeholder="e.g. a123456@siswa.ukm.edu.my" required>
            </div>
            <div class="form-group">
                <label>Kata Laluan</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">Log Masuk</button>
        </form>

        <!-- FORM PENDAFTARAN -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Nama Penuh</label>
                <input type="text" id="regName" placeholder="Nama mengikut kad pengenalan" required>
            </div>
            <div class="form-group">
                <label>E-mel Rasmi UKM</label>
                <input type="email" id="regEmail" placeholder="@siswa.ukm.edu.my atau @ukm.edu.my" required>
            </div>
            <div class="form-group">
                <label>No. Matrik (Pelajar Sahaja)</label>
                <input type="text" id="regMatric" placeholder="e.g. A190000">
            </div>
            <div class="form-group">
                <label>Peranan Pengguna</label>
                <select id="regRole" onchange="toggleSetSelect(this.value)" required>
                    <option value="STUDENT">Pelajar (Student)</option>
                    <option value="LECTURER">Pensyarah (Lecturer)</option>
                </select>
            </div>
            <div class="form-group" id="setGroupWrapper">
                <label>Kumpulan Set Pelajar</label>
                <select id="regSet">
                    <option value="Set 1">Set 1</option>
                    <option value="Set 2">Set 2</option>
                    <option value="Set 3">Set 3</option>
                    <option value="Set 4">Set 4</option>
                    <option value="Set 5">Set 5</option>
                    <option value="Set 6">Set 6</option>
                    <option value="Set 7">Set 7</option>
                    <option value="Set 8">Set 8</option>
                    <option value="Set 9">Set 9</option>
                    <option value="Set 10">Set 10</option>
                    <option value="Set 11">Set 11</option>
                </select>
            </div>
            <div class="form-group">
                <label>Kata Laluan</label>
                <input type="password" id="regPassword" minlength="6" required>
            </div>
            <button type="submit" class="btn-submit">Daftar Akaun</button>
        </form>
    </div>

    <script type="module">
        import { loginUser, registerUser } from './auth.js';

        window.switchTab = function (tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const errAlert = document.getElementById('errorAlert');

            errAlert.style.display = 'none';

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        };

        window.toggleSetSelect = function (role) {
            const setWrapper = document.getElementById('setGroupWrapper');
            setWrapper.style.display = (role === 'LECTURER') ? 'none' : 'block';
        };

        // Event listener Log Masuk
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const errAlert = document.getElementById('errorAlert');

            try {
                const res = await loginUser(email, pass);
                if (res.role === 'LECTURER') {
                    window.location.href = 'dashboard-lecturer.html';
                } else {
                    window.location.href = 'dashboard-student.html';
                }
            } catch (err) {
                errAlert.textContent = err.message;
                errAlert.style.display = 'block';
            }
        });

        // Event listener Pendaftaran Akaun
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const matric = document.getElementById('regMatric').value.trim();
            const role = document.getElementById('regRole').value;
            const setGroup = document.getElementById('regSet').value;
            const pass = document.getElementById('regPassword').value;
            const errAlert = document.getElementById('errorAlert');

            try {
                await registerUser(email, pass, name, matric, role, setGroup);
                alert('Pendaftaran berjaya! Mengalih keluar ke papan pemuka...');
                window.location.href = (role === 'LECTURER') ? 'dashboard-lecturer.html' : 'dashboard-student.html';
            } catch (err) {
                errAlert.textContent = err.message;
                errAlert.style.display = 'block';
            }
        });
    </script>

    <script src="script.js"></script>
</body>

</html>
