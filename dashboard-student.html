<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pelajar - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .subject-card { background: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; text-decoration: none; color: var(--text-color); font-weight: bold; }
        .subject-card:hover { border-color: var(--primary-color); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🎓 PINTAR@Sphere</div>
        <ul>
            <li><a href="dashboard-student.html">Dashboard</a></li>
            <li><a href="community.html">Komuniti</a></li>
        </ul>
        <button onclick="logout()">Log Keluar</button>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </nav>

    <div style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
        <div style="background: linear-gradient(135deg, #0056b3, #002d5e); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <h1 id="stdName" style="margin:0;">Memuatkan...</h1>
            <p style="margin:5px 0 0 0;">No Matrik: <b id="stdMatric">-</b> | Kumpulan: <b id="stdSet">-</b></p>
        </div>

        <div class="grid-3">
            <div style="background:var(--card-bg); padding:20px; border-radius:10px; border:1px solid var(--border-color); grid-column: span 2;">
                <h3>📚 Subjek Teras ASPI</h3>
                <!-- Pautan Dinamik Menggunakan 1 Fail subject.html -->
                <div class="subject-grid">
                    <a href="subject.html?code=biology" class="subject-card">🧬 Biology</a>
                    <a href="subject.html?code=chemistry" class="subject-card">🧪 Chemistry</a>
                    <a href="subject.html?code=physics" class="subject-card">⚛️ Physics</a>
                    <a href="subject.html?code=logical" class="subject-card">🧠 Logical</a>
                    <a href="subject.html?code=statistics" class="subject-card">📊 Statistics</a>
                    <a href="subject.html?code=lla" class="subject-card">📖 LLA</a>
                    <a href="subject.html?code=jati_diri" class="subject-card">🛡️ Jati Diri</a>
                    <a href="subject.html?code=research" class="subject-card">🔍 Research</a>
                </div>
            </div>

            <div style="background:var(--card-bg); padding:20px; border-radius:10px; border:1px solid var(--border-color);">
                <h3>🎯 Kalkulator Anggaran GPA</h3>
                <label>Purata Target Markah (%)</label>
                <input type="number" id="targetScore" placeholder="e.g. 80" style="width:100%; padding:8px; margin:8px 0;">
                <button onclick="calculateGPA()" style="width:100%;">Kira Anggaran GPA</button>
                <h2 id="gpaResult" style="text-align:center; margin-top:15px; color:var(--primary-color);">-</h2>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged } from './firebase-config.js';
        import { getStudentProfile } from './app-core.js';
        import { logoutUser } from './auth.js';

        window.logout = logoutUser;
        window.calculateGPA = function() {
            const val = parseFloat(document.getElementById('targetScore').value);
            if (!val) return;
            let gpa = 0.0;
            if (val >= 80) gpa = 4.0;
            else if (val >= 75) gpa = 3.67;
            else if (val >= 70) gpa = 3.33;
            else if (val >= 65) gpa = 3.00;
            else gpa = 2.50;
            document.getElementById('gpaResult').textContent = `Est. GPA: ${gpa.toFixed(2)}`;
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const profile = await getStudentProfile(user.uid);
                document.getElementById('stdName').textContent = profile.name;
                document.getElementById('stdMatric').textContent = profile.matricNo || 'N/A';
                document.getElementById('stdSet').textContent = profile.set || 'Set 1';
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
    <script type="module" src="app-core.js"></script>
</body>
</html>
