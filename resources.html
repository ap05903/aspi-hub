<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahan Pembelajaran - PINTAR@Sphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">🎓 PINTAR@Sphere</div>
        <ul>
            <li><a href="dashboard-student.html">Dashboard</a></li>
            <li><a href="resources.html">Bahan</a></li>
            <li><a href="tools.html">GPA Calculator</a></li>
            <li><a href="calender.html">Kalendar</a></li>
            <li><a href="community.html">Komuniti</a></li>
        </ul>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </nav>
    <div style="max-width: 1000px; margin: 30px auto; padding: 0 20px;">
        <h2>📁 Bahan Pembelajaran Mengikut Subjek</h2>
        <div id="resourcesList">Memuatkan semua bahan...</div>
    </div>
    <script type="module">
        import { db, collection, getDocs } from './firebase-config.js';
        
        async function loadAllResources() {
            const container = document.getElementById('resourcesList');
            const snap = await getDocs(collection(db, "learning_resources"));
            if (snap.empty) {
                container.innerHTML = "<p>Tiada bahan ditemui.</p>";
                return;
            }
            container.innerHTML = "";
            snap.forEach(docSnap => {
                const data = docSnap.data();
                const div = document.createElement('div');
                div.style.cssText = "background:white; padding:15px; margin-bottom:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05); display:flex; justify-content:space-between;";
                div.innerHTML = `
                    <div>
                        <strong>${data.title}</strong> [${data.subject}]<br>
                        <small>Pensyarah: ${data.lecturerName || 'N/A'}</small>
                    </div>
                    <a href="${data.driveUrl}" target="_blank" style="color:#0056b3; font-weight:bold;">Buka Drive 🔗</a>
                `;
                container.appendChild(div);
            });
        }
        loadAllResources();
    </script>
    <script src="script.js"></script>
</body>
</html>
