<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASPI Hub - Timetable</title>

    <link rel="stylesheet" href="timetable.css">
</head>

<body>

    <div class="timetable-page">

        <!-- HEADER -->
        <div class="timetable-top">

            <div>
                <h1>📚 Class Timetable</h1>
                <p>ASPI UKM · Semester 1 · Academic Session 2026/2027</p>
            </div>

            <div class="set-selector">
                <label for="setSelect">Your Set</label>

                <select id="setSelect">
                    <option value="Set 1">Set 1</option>
                    <option value="Set 2">Set 2</option>
                    <option value="Set 3">Set 3</option>
                    <option value="Set 4">Set 4</option>
                    <option value="Set 5">Set 5</option>
                    <option value="Set 6">Set 6</option>
                    <option value="Set 7">Set 7</option>
                    <option value="Set 8">Set 8</option>
                    <option value="Set 9">Set 9</option>
                    <option value="Set 10">Set 10</option>
                    <option value="Set 11">Set 11</option>
                </select>
            </div>

        </div>


        <!-- CURRENT SET -->
        <div class="selected-set">
            <span>Currently viewing:</span>
            <strong id="selectedSetText">Set 1</strong>
        </div>


        <!-- TIMETABLE -->
        <div class="timetable-wrapper">

            <table id="timetable">

                <thead>

                    <tr>
                        <th class="time-header">Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                    </tr>

                </thead>

                <tbody id="timetableBody">
                    <!-- JavaScript generates timetable -->
                </tbody>

            </table>

        </div>


        <!-- LEGEND -->
        <div class="timetable-legend">

            <div class="legend-title">
                Class types
            </div>

            <div class="legend-items">

                <span>
                    <i class="legend-box lecture"></i>
                    Lecture
                </span>

                <span>
                    <i class="legend-box lab"></i>
                    Lab / Tutorial
                </span>

                <span>
                    <i class="legend-box research"></i>
                    Research
                </span>

                <span>
                    <i class="legend-box activity"></i>
                    Activity
                </span>

            </div>

        </div>


        <!-- MOBILE NOTE -->
        <div class="mobile-note">
            💡 Swipe left or right to view the full timetable on smaller screens.
        </div>

    </div>


    <script src="timetable.js"></script>

</body>
</html>
